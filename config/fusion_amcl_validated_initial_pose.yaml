amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: slam_map
    odom_frame_id: fusion_odom
    base_frame_id: fusion_base
    scan_topic: /fusion/scan
    map_topic: /fusion/localization_map
    tf_broadcast: true
    transform_tolerance: 0.3
    set_initial_pose: true
    initial_pose:
      x: -5.8592
      y: -2.172
      z: 0.0
      yaw: 2.20775
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: -1.0
    sigma_hit: 0.2
    z_hit: 0.7
    z_rand: 0.3
    z_max: 0.0
    z_short: 0.0
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
fusion_map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: /fusion/localization_map
    frame_id: slam_map

# Mapping comparison (Test 2): sensor emulator with the CALIBRATED injected noise, TEAM R reporting (formula in sim_vesc_imu.py).
# Injected noise/bias/scale are IDENTICAL in fusion_sim_sensors_mapping_team.yaml and
# fusion_sim_sensors_mapping_mine.yaml (copied from fusion_sim_sensors_calibrated.yaml);
# only the reported variances (EKF R) differ. Use with:
#   tools/mission/full_autonomy.py --sensor-config config/fusion_sim_sensors_mapping_team.yaml
sim_vesc_imu:
  ros__parameters:
    seed: 42
    wheel_diameter_m: 0.1016
    gear_ratio: 4.092
    motor_pole_pairs: 7.0
    vesc_hz: 50.0
    imu_hz: 100.0

    # ---- injected errors (identical in both mapping files) ----
    vesc_speed_scale: 1.003
    vesc_erpm_noise_std: 162.0     # = 0.03 m/s
    gyro_bias_rad_s: 0.0003
    gyro_noise_std_rad_s: 0.003

    # ---- reported R (covariance written into the messages -> EKF R) ----
    reported_vx_variance: -1.0    # -1 = team formula: max((erpm_noise/erpm_per_mps)^2, 0.02^2) = 0.000905
    reported_gyro_variance: -1.0  # -1 = team formula: max(gyro_noise^2, 1e-4) = 1.0e-4

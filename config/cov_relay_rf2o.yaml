# R for rf2o (simulation) - DEFAULT "C1" settings (use with config/fusion_ekf_moatasem_rf2o.yaml,
# which has NO rf2o gate). rf2o R x gate test (sim, 2x2, 5 runs each, rear-axle grading):
# C1 = this R + no gate: 0.041 +- 0.005 m RMSE, best and most consistent of the four.
# The data-based R + 3.7-sigma gate ("C4") is kept as config/cov_relay_rf2o_c4.yaml.
# Real car: re-measure R (rf2o minus a reference, R = (k x robust std)^2, k = 1.5-2).
cov_relay:
  ros__parameters:
    input_topic: /fusion/rf2o/odom
    output_topic: /fusion/rf2o/odom_cov
    var_vx: 0.01        # sigma 0.1 m/s (best in the 2x2 test; measured robust std was 0.036)
    var_vyaw: 0.0025    # sigma 0.05 rad/s (measured robust std was 0.038)
    var_vy: 1.0         # not fused
    var_unused: 1.0
    pose_var: 1000000.0
